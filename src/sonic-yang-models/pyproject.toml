[project]
name = "sonic-yang-models"
version = "1.0"
requires-python = ">=3.11"
dependencies = [
    "jinja2",
    # PEP517 build frontend/backend, required by the aspect uv extension:
    # markupsafe (jinja2's C-extension dep) has an sdist and no none-any wheel,
    # so the extension provisions an sdist_build repo whose build tool resolves
    # `build`/`setuptools` from this lock (default_build_dependencies). They
    # must also be [project] dependencies (not just a dependency-group) so the
    # hub emits their aliases; dev-group membership alone leaves the
    # sdist_build's `//:build` reference dangling, which kills any loading-phase
    # `bazel query` whose closure reaches this hub. Same pattern as
    # dockers/docker-base-trixie/pyproject.toml.
    "build",
    "setuptools",
]
