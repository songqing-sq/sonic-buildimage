[project]
name = "sonic-yang-models"
version = "1.0"
# setup.py passes long_description=<README.rst contents>, but setuptools treats
# a [project] table as authoritative and then reads [project].readme -- absent,
# it hands None to _long_description and dies with
# "AttributeError: 'NoneType' object has no attribute 'get'". That breaks the
# Make wheel build (slave.mk builds this with pip/setuptools), and every wheel
# downstream of it, so declare the same file here.
readme = "README.rst"
requires-python = ">=3.11"
dependencies = [
    "jinja2",
    # tests/yang_model_pytests: setup.py extras_require["testing"].
    "pytest",
    # libyang's binding is a CFFI extension; `from _libyang import ffi, lib`
    # needs cffi's own _cffi_backend module at import time.
    "cffi",
    # PEP517 build frontend/backend, required by the aspect uv extension:
    # markupsafe (jinja2's C-extension dep) has an sdist and no none-any wheel,
    # so the extension provisions an sdist_build repo whose build tool resolves
    # `build`/`setuptools` from this lock (default_build_dependencies). They
    # must also be [project] dependencies (not just a dependency-group) so the
    # hub emits their aliases; dev-group membership alone leaves the
    # sdist_build's `//:build` reference dangling, which kills any loading-phase
    # `bazel query` whose closure reaches this hub. Same pattern as
    # dockers/docker-base-trixie/pyproject.toml.
    "build",
    "setuptools",
]

# setup.py renders four yang models with jinja2 at metadata-generation time, so
# under PEP517 build isolation jinja2 has to be a build requirement -- otherwise
# `pip install .` fails with "No module named 'jinja2'" and takes every wheel
# downstream of this one with it. Make only ever got away without this when some
# earlier package in the same container happened to install jinja2 first.
[build-system]
requires = ["setuptools", "wheel", "jinja2"]
build-backend = "setuptools.build_meta"
